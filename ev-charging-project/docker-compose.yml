services:
  postgres:
    image: postgres:16
    container_name: ev_charging_db
    environment:
      POSTGRES_USER: ev_admin
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ev_charging
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/seed:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
